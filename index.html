<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e2a29">
<link rel="manifest" href="manifest.json">
<title>Заявки на объекте</title>
<style>
:root{--bg:#f4f3f0;--card:#fff;--ink:#2e2a29;--mut:#6f6a66;--line:#e2dfda;--acc:#d6b827;--accd:#b89b12;--ok:#2e7d32;--warn:#e65100;--bad:#c62828;--blue:#1f4e8c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;padding-top:max(10px,env(safe-area-inset-top))}
header .t{flex:1;min-width:0}
header .t b{display:block;font-size:17px}
header .t small{color:#cfc9c4;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:#fff;font-size:22px;padding:6px 8px}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;background:#444;color:#fff}
.pill.off{background:#7a5a00}
.wrap{padding:12px 12px 0;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;background:var(--acc);color:var(--ink)}
.btn.sec{background:#ece9e4}.btn.big{width:100%}.btn.bad{background:#f8d7d3;color:var(--bad)}
.btn:disabled{opacity:.45}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:18px;padding:7px 14px;font-size:15px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
input,select,textarea{width:100%;font:inherit;font-size:16px;border:1px solid #cfcac4;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.item{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);background:#fff}
.item:first-child{border-radius:12px 12px 0 0}.item:last-child{border-radius:0 0 12px 12px;border-bottom:0}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.item .c{width:64px;flex:none;font-size:12px;color:var(--mut);padding-top:2px}
.item .n{flex:1;min-width:0}
.pd{font-size:11px;color:#2f6f3e;margin-top:3px}.pd.late{color:#b3261e;font-weight:700}
.item .n div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px}
.item .n small{color:var(--mut);font-size:13px}
.item .r{flex:none;text-align:right;font-size:13px;min-width:70px}
.item .r b{font-size:16px;display:block}
.st-ok{color:var(--ok)}.st-warn{color:var(--warn)}.st-bad{color:var(--bad)}
.badge{display:inline-block;background:var(--blue);color:#fff;border-radius:9px;font-size:12px;padding:1px 7px;margin-left:4px}
.fab{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:6;display:flex;gap:10px;max-width:696px;margin:0 auto}
.fab .btn{flex:1;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px 14px max(18px,env(safe-area-inset-bottom));z-index:21;display:none;max-width:720px;margin:0 auto}
.show{display:block}
.row{display:flex;gap:10px}.row>*{flex:1}
.step{display:flex;gap:8px;align-items:center}.step button{width:48px;height:48px;border-radius:10px;border:1px solid #cfcac4;background:#fff;font-size:24px}
.warnbox{background:#fff4e5;border:1px solid #ffcc80;border-radius:10px;padding:9px 11px;font-size:14px;margin-top:8px}
.badbox{background:#fdecea;border:1px solid #f5a8a0;color:var(--bad)}
.mut{color:var(--mut);font-size:13px}
h2{font-size:18px;margin:6px 0 10px}
.empty{padding:26px 12px;text-align:center;color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#222;color:#fff;border-radius:20px;padding:9px 16px;font-size:14px;z-index:40;display:none;max-width:90%}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.qb{border:1px solid var(--line,#ccc);background:#fff;border-radius:8px;padding:6px 10px;font-size:16px;font-weight:700;color:inherit}
.x{border:0;background:none;color:var(--bad);font-size:20px;padding:4px 8px}
</style>
</head>
<body>
<header>
  <div class="t"><b id="hTitle">Заявки на объекте</b><small id="hSub">реестр не загружен</small></div>
  <span class="pill" id="net">онлайн</span>
  <button id="bMenu" aria-label="Меню">☰</button>
</header>
<div class="wrap" id="app"></div>
<div class="fab" id="fab"></div>
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fSnap" accept=".json,application/json" hidden>

<script>
"use strict";
var CFG={api:""},AUTH=null;
function KEYo(){return "bitreq1"+(CFG.api&&AUTH&&AUTH.obj?":"+AUTH.obj:"")}
var S={snap:null,draft:{no:null,lines:[],due:"",author:""},reqs:[],plan:{},srv:{pend:{},max:0,all:[],last:""},view:"cat",sect:null,q:"",set:{author:"",days:7}};
function load(){try{var j=localStorage.getItem(KEYo());if(j){var o=JSON.parse(j);for(var k in o)S[k]=o[k];}}catch(e){}}
function save(){try{localStorage.setItem(KEYo(),JSON.stringify({snap:S.snap,draft:S.draft,reqs:S.reqs,plan:S.plan,srv:S.srv,set:S.set}));}catch(e){toast("Не удалось сохранить данные на телефоне");}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(n){n=Math.round(n*100)/100;return String(n).replace(".",",")}
function iso(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function ru(s){if(!s)return"";var p=s.slice(0,10).split("-");return p[2]+"."+p[1]+"."+p[0]}
function sd(s){return s?ru(s).slice(0,5):""}
function dueInfo(r){var m={};r.lines.forEach(function(l){m[l.due||r.due]=1});var k=Object.keys(m).sort();return k.length>1?"по позициям (с "+ru(k[0])+")":ru(k[0]||r.due)}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d)}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},2600)}
function clean(s){return String(s==null?"":s).replace(/[;\r\n\t]+/g," ").trim()}

/* ---------- расчёт остатков ---------- */
function snapTs(){return S.snap?S.snap.date:""}
function pendingQty(code){ // что уже набрано на телефоне и ещё не в снимке
  var t=0,i,L;
  S.draft.lines.forEach(function(l){if(l.code===code)t+=l.qty; if(l.replCode===code)t+=l.replQty});
  S.reqs.forEach(function(r){ if(CFG.api?!r.reg:r.ts>snapTs()) r.lines.forEach(function(l){if(l.code===code)t+=l.qty; if(l.replCode===code)t+=l.replQty}) });
  if(CFG.api&&S.srv&&S.srv.pend)t+=S.srv.pend[code]||0;
  return t;
}
function avail(it){return Math.max(0,Math.round((it[7]-pendingQty(it[1]))*1000)/1000)}
function find(code){if(!S.snap)return null;if(!S.snap._idx){S.snap._idx={};S.snap.items.forEach(function(it){S.snap._idx[it[1]]=it})}return S.snap._idx[code]}
function nextNo(){var n=S.snap?S.snap.nextReq:1;if(CFG.api&&S.srv&&S.srv.max>=n)n=S.srv.max+1;S.reqs.forEach(function(r){if(r.no>=n)n=r.no+1});return n}

/* ---------- экраны ---------- */
function render(){
  var a=$("app"),f=$("fab");
  if(CFG.api&&(!AUTH||!AUTH.token)){renderLogin(a,f);hdr();return}
  if(CFG.api&&!S.snap){a.innerHTML='<div class="card"><h2>Реестр объекта</h2><p>Данные ещё не получены с сервера. Подключитесь к интернету — они загрузятся сами.</p><button class="btn big" id="mSync">Обновить</button></div>';f.innerHTML="";hdr();return}
  if(!S.snap){a.innerHTML='<div class="card"><h2>Нужен реестр объекта</h2><p>Файл <b>Снимок_реестра_….json</b> делает снабжение кнопкой в Excel и присылает вам (Telegram, почта, Bitrix). Откройте его здесь — дальше приложение работает без интернета.</p><button class="btn big" id="bLoad">Выбрать файл снимка</button></div>';f.innerHTML="";bind();hdr();return}
  hdr();
  if(S.view==="cat")renderCat(a,f);else if(S.view==="draft")renderDraft(a,f);else if(S.view==="hist")renderHist(a,f);
  bind();
}
function hdr(){
  var un=CFG.api?S.reqs.filter(function(r){return !r.synced}).length:0;
  $("hTitle").textContent=S.snap?(S.snap.label||"Заявки"):"Заявки на объекте";
  $("hSub").textContent=(CFG.api&&(!AUTH||!AUTH.token))?"вход по рабочей почте":(S.snap?("Реестр от "+ru(S.snap.date)+" · заявка №"+(S.draft.no||nextNo())+(un?" · ждёт связи: "+un:"")):"реестр не загружен");
  var n=$("net");n.textContent=navigator.onLine?"онлайн":"офлайн";n.className="pill"+(navigator.onLine?"":" off");
}
function renderCat(a,f){
  var sects=[];S.snap.items.forEach(function(it){if(sects.indexOf(it[0])<0)sects.push(it[0])});
  if(!S.sect||sects.indexOf(S.sect)<0)S.sect=sects[0];
  var q=S.q.toLowerCase().trim(),h='<div class="chips">';
  sects.forEach(function(s){h+='<button class="chip'+(S.sect===s?" on":"")+'" data-sect="'+esc(s)+'">'+esc(s)+'</button>'});
  h+='</div><input id="q" type="search" placeholder="Поиск по коду или названию" value="'+esc(S.q)+'" style="margin-bottom:10px">';
  var items=S.snap.items.filter(function(it){return q?(it[1]+" "+it[3]).toLowerCase().indexOf(q)>=0:it[0]===S.sect});
  h+='<div class="list">';
  if(!items.length)h+='<div class="empty">Ничего не найдено</div>';
  items.slice(0,200).forEach(function(it){
    var av=avail(it),inD=S.draft.lines.filter(function(l){return l.code===it[1]}).reduce(function(s,l){return s+l.qty},0);
    var cls=av<=0?"st-bad":(av<it[5]?"st-warn":"st-ok");
    h+='<div class="item" data-code="'+esc(it[1])+'"><div class="c">'+esc(it[1])+(S.plan[it[1]]?'<div class="pd'+(S.plan[it[1]]<iso(new Date())?' late':'')+'">к '+sd(S.plan[it[1]])+'</div>':'')+'</div><div class="n"><div>'+esc(it[3])+'</div><small>'+esc(it[8]||"")+(inD?'<span class="badge">в заявке '+fmt(inD)+'</span>':'')+'</small></div><div class="r '+cls+'"><b>'+fmt(av)+'</b>'+esc(it[4])+'<br><span class="mut">из '+fmt(it[5])+'</span></div></div>';
  });
  if(items.length>200)h+='<div class="empty">Показаны первые 200 — уточните поиск</div>';
  h+='</div><button class="btn sec big" id="bOut">+ Позиция вне проекта</button>';
  a.innerHTML='<div class="wrap" style="padding:0">'+h+'</div>';
  var n=S.draft.lines.length;
  f.innerHTML='<button class="btn big" id="bDraft">Заявка №'+(S.draft.no||nextNo())+' · '+n+' поз. →</button>';
}
function lineTxt(l){
  if(l.code)return l.code+" | "+l.name;
  return l.newName+(l.replCode?" (замена "+l.replCode+")":" (вне проекта)");
}
function renderDraft(a,f){
  var d=S.draft,h='<h2>'+(d.corrOf?'Корректирующая заявка №':(d.orig?'Редактирование заявки №':'Заявка №'))+(d.no||nextNo())+(d.corrOf?' к №'+d.corrOf:'')+'</h2>'+(d.corrOf?'<div class="card" style="background:#fff7d6">Укажите в каждой строке, сколько должно быть <b>в итоге</b>. Уменьшение вернёт остаток в реестр. Можно добавить и новые позиции. Строки без изменений в заявку не попадут.</div>':'')+(d.orig?'<div class="card" style="background:#fff7d6">Вы правите уже сформированную заявку. Нажмите «Сформировать», чтобы сохранить изменения, и отправьте её заново. Если снабжение уже загрузило прежнюю версию в реестр — предупредите его.<br><button class="btn sec" id="bCancelEdit" style="margin-top:8px">Отменить правки</button></div>':'');
  h+='<div class="card"><div class="row"><div><label>Номер заявки</label><input id="dNo" type="number" inputmode="numeric" value="'+(d.no||nextNo())+'"></div><div><label>Нужно к (по умолчанию)</label><input id="dDue" type="date" value="'+esc(d.due||addDays(S.set.days))+'"></div></div><label>Кто составил</label><input id="dAuthor" value="'+esc(d.author||S.set.author)+'" placeholder="Фамилия, должность"><button class="btn sec" id="bApplyDue" style="margin-top:8px">Применить дату ко всем позициям</button></div>';
  if(!d.lines.length)h+='<div class="empty">В заявке пока нет позиций.<br>Вернитесь в каталог и нажмите на позицию.</div>';
  else{h+='<div class="card"><table class="t">';d.lines.forEach(function(l,i){
    h+='<tr><td><b>'+(i+1)+'.</b></td><td>'+esc(lineTxt(l))+(l.note?'<br><span class="mut">'+esc(l.note)+'</span>':'')+(l.analog?'<br><span class="mut">допускается аналог</span>':'')+'<br><span class="mut">получить к '+sd(l.due||d.due||addDays(S.set.days))+'</span>'+(l.base!==undefined?'<br><span class="mut">было '+fmt(l.base)+' → '+(l.qty||l.replQty?'<b>станет '+fmt(l.base+l.qty)+'</b>':'без изменений')+'</span>':'')+'</td><td style="text-align:right;white-space:nowrap"><button class="qb" data-edit="'+i+'">'+fmt(l.base!==undefined?l.base+l.qty:l.qty)+' '+esc(l.unit)+' ✎</button></td><td><button class="x" data-del="'+i+'">✕</button></td></tr>'});
    h+='</table></div>';}
  a.innerHTML=h;
  f.innerHTML='<button class="btn sec" id="bBack">← Каталог</button>'+(d.lines.length?'<button class="btn" id="bFinish">Сформировать</button>':'');
}
function isPriv(){return CFG.api&&AUTH&&(AUTH.role==="Директор"||AUTH.role==="Снабжение"||AUTH.role==="Админ")}
function stTxt(r){
  if(r.canceled)return '<span class="st-bad">отменена</span>';
  if(r.reg)return '<span class="st-ok">✓ загружена в реестр</span>';
  return r.sent?'<span class="st-ok">✓ отправлена в Bitrix</span>':'<span class="st-warn">не отмечена как отправленная</span>';
}
function renderHist(a,f){
  var h='<h2>Заявки</h2>',tab=S.histTab==="all"&&isPriv()?"all":"mine";
  if(isPriv())h+='<div class="chips"><button class="chip'+(tab==="mine"?" on":"")+'" data-tab="mine">Мои</button><button class="chip'+(tab==="all"?" on":"")+'" data-tab="all">Все сотрудники</button></div>';
  if(tab==="all"){
    var all=(S.srv.all||[]).slice().sort(function(x,y){return y.no-x.no});
    if(!all.length)h+='<div class="empty">На сервере пока нет заявок</div>';
    all.forEach(function(r){
      h+='<div class="card" data-all="'+esc(r.cid)+'"><b>Заявка №'+r.no+(r.corr?' (корр. к №'+esc(r.corr)+')':'')+'</b> · '+ru(r.date)+' · '+r.lines.length+' поз.<br><span class="mut">'+esc(r.author||"")+'</span> '+stTxt(r)+(r.warn?'<br><span class="st-bad">⚠ '+esc(r.warn)+'</span>':'')+'</div>';
    });
    h+='<div class="mut" style="margin-top:8px">Обновлено: '+esc(S.srv.last||"—")+'</div>';
  }else{
    if(!S.reqs.length)h+='<div class="empty">Пока ничего нет</div>';
    S.reqs.slice().reverse().forEach(function(r){
      h+='<div class="card" data-req="'+r.no+'"><b>Заявка №'+r.no+(r.rev?' (изм. '+r.rev+')':'')+(r.corr?' (корр. к №'+r.corr+')':'')+'</b> · '+ru(r.date)+' · '+r.lines.length+' поз.<br><span class="mut">'+esc(r.author||"")+'</span> '+stTxt(r)+(CFG.api?(r.synced?' <span class="mut">☁</span>':' <span class="st-warn">⏳ ждёт связи</span>'):'')+(r.warn?'<br><span class="st-bad">⚠ '+esc(r.warn)+'</span>':'')+(r.err?'<br><span class="st-bad">'+esc(r.err)+'</span>':'')+'</div>';
    });
  }
  a.innerHTML=h;f.innerHTML='<button class="btn sec big" id="bBack">← Каталог</button>';
}
function allSheet(cid){
  var r=(S.srv.all||[]).filter(function(x){return x.cid===cid})[0];if(!r)return;
  var h='<b>Заявка №'+r.no+(r.corr?' (корр. к №'+esc(r.corr)+')':'')+'</b><div class="mut" style="margin:4px 0 10px">'+ru(r.date)+' · '+esc(r.author||"")+' · '+stTxt(r)+'</div>';
  h+='<table class="t">';
  r.lines.forEach(function(l,i){h+='<tr><td><b>'+(i+1)+'.</b></td><td>'+esc(lineTxt(l))+(l.note?'<br><span class="mut">'+esc(l.note)+'</span>':'')+'<br><span class="mut">к '+sd(l.due||r.due)+'</span></td><td style="text-align:right;white-space:nowrap"><b>'+fmt(l.qty)+'</b> '+esc(l.unit)+'</td></tr>'});
  h+='</table>'+(r.warn?'<div class="warnbox badbox">⚠ '+esc(r.warn)+'</div>':'')+'<button class="btn sec big" id="sClose" style="margin-top:12px">Закрыть</button>';
  openSheet(h);
}

/* ---------- окна ---------- */
function openSheet(h){$("sheet").innerHTML=h;$("bg").classList.add("show");$("sheet").classList.add("show");}
function closeSheet(){$("bg").classList.remove("show");$("sheet").classList.remove("show");}
function openReqs(){return S.reqs.filter(function(r){return !r.sent&&!r.corr})}
function targetSel(){
  if(S.draft.corrOf)return "";
  var o=openReqs();if(!o.length)return "";
  var cur=S.target&&getReq(S.target)&&!getReq(S.target).sent?String(S.target):"";
  return '<label>Добавить в</label><select id="tSel"><option value=""'+(cur===""?" selected":"")+'>Новая заявка №'+(S.draft.no||nextNo())+'</option>'+
    o.map(function(r){return '<option value="'+r.no+'"'+(String(r.no)===cur?" selected":"")+'>Заявка №'+r.no+' · '+r.lines.length+' поз. (не отправлена)</option>'}).join("")+'</select>';
}
function targetLines(){
  var e=$("tSel"),v=e?e.value:"";S.target=v||null;
  var r=v?getReq(v):null;
  if(r&&!r.sent)return {lines:r.lines,req:r};
  S.target=null;return {lines:S.draft.lines,req:null};
}
function afterAdd(t){
  if(t.req){t.req.synced=false;t.req.err=""}
  if(t.req){var vs={};t.req.lines.forEach(function(l){vs[l.sect]=1});t.req.ver=Object.keys(vs).map(function(x){return x+": "+((S.snap.ver&&S.snap.ver[x])||"—")}).join("; ");}
  save();closeSheet();render();toast("Добавлено в заявку №"+(t.req?t.req.no:(S.draft.no||nextNo())));if(t.req)sync();
}
function itemSheet(code){
  var it=find(code);if(!it)return;var av=avail(it);
  var h='<b>'+esc(it[1])+'</b> · '+esc(it[0])+'<div style="margin:4px 0 10px">'+esc(it[3])+'</div>'+
   '<div class="mut">По проекту: '+fmt(it[5])+' '+esc(it[4])+' · заказано: '+fmt(it[6])+' · <b>можно заказать: '+fmt(av)+'</b></div>'+
   '<label>Количество, '+esc(it[4])+'</label><div class="step"><button data-st="-1">−</button><input id="iQty" type="number" inputmode="decimal" step="any" value="'+av+'"><button data-st="1">+</button></div><div id="iWarn"></div>'+
   '<label>Примечание</label><input id="iNote" placeholder="например: на 2 этаж">'+
   '<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:16px;margin-top:12px"><input id="iAn" type="checkbox" style="width:22px;height:22px"> Допускается аналог</label>'+

function addItem(code){
  var T=targetLines(),L=T.lines,due=$("iDue").value||(T.req?T.req.due:S.draft.due)||addDays(S.set.days),it=find(code),q=parseFloat(String($("iQty").value).replace(",","."))||0,note=$("iNote").value.trim(),an=$("iAn").checked,repl=$("iRepl").style.display==="block";
  if(repl){
    var nm=$("rName").value.trim(),un=$("rUnit").value.trim(),nq=parseFloat(String($("rQty").value).replace(",","."))||0,rq=parseFloat(String($("rRep").value).replace(",","."))||0;
    if(!nm||!un||nq<=0||rq<=0){toast("Заполните название, единицу, количество нового и заменяемого");return}
    if(rq>avail(it)+1e-9){toast("Заменяется больше, чем осталось по проекту ("+fmt(avail(it))+")");return}
    L.push({sect:it[0],code:"",name:"",newName:nm,unit:un,qty:nq,analog:an,note:("ЗАМЕНА "+code+" (вместо "+fmt(rq)+" "+it[4]+")"+(note?"; "+note:"")),replCode:code,replName:it[3],replQty:rq,due:due});
  }else{
    if(q<=0||q>avail(it)+1e-9){toast("Проверьте количество");return}
    var ex=L.filter(function(l){return l.code===code&&!l.replCode})[0];
    if(ex){ex.qty=Math.round((ex.qty+q)*1000)/1000;if(!ex.due||due<ex.due)ex.due=due;if(note)ex.note=(ex.note?ex.note+"; ":"")+note;if(an)ex.analog=true}
    else L.push({sect:it[0],code:code,name:it[3],newName:"",unit:it[4],qty:q,analog:an,note:note,replCode:"",replName:"",replQty:0,due:due});
  }
  afterAdd(T);
}
function lkey(l){return (l.code||("N:"+l.newName))+"|"+(l.replCode||"")}
function corrReq(no){
  var r=getReq(no);if(!r)return;
  if(S.draft.lines.length){toast("Сначала сформируйте или очистите текущий черновик");return}
  var m={},ord=[];
  function add(l){var k=lkey(l);if(!m[k]){m[k]=JSON.parse(JSON.stringify(l));m[k].qty=0;m[k].replQty=0;ord.push(k)}m[k].qty+=l.qty;m[k].replQty+=(l.replQty||0)}
  r.lines.forEach(add);
  S.reqs.forEach(function(x){if(x.corr==r.no)x.lines.forEach(function(l){if(m[lkey(l)])add(l)})});
  var lines=[];ord.forEach(function(k){var l=m[k];if(l.qty<=0&&l.replQty<=0)return;l.base=Math.round(l.qty*1000)/1000;l.baseRepl=Math.round(l.replQty*1000)/1000;l.qty=0;l.replQty=0;l.note="";l.analog=false;lines.push(l)});
  if(!lines.length){toast("В заявке нечего корректировать");return}
  S.draft={no:null,lines:lines,due:r.due,author:S.set.author||r.author,corrOf:r.no};
  save();closeSheet();S.view="draft";render();window.scrollTo(0,0);toast("Корректирующая к заявке №"+r.no);
}
function editReq(no){
  var r=getReq(no);if(!r)return;
  if(S.draft.lines.length){toast("Сначала сформируйте или очистите текущий черновик");return}
  if(r.sent||r.reg){toast(r.reg?"Заявка уже загружена в реестр — выпустите корректирующую":"Заявка уже отправлена — выпустите корректирующую");return}
  var cp=JSON.parse(JSON.stringify(r));
  S.reqs=S.reqs.filter(function(x){return x.no!==r.no});
  S.draft={no:r.no,lines:cp.lines,due:r.due,author:r.author,cid:r.cid,orig:JSON.parse(JSON.stringify(r))};
  save();closeSheet();S.view="draft";render();window.scrollTo(0,0);toast("Заявка №"+r.no+" открыта для правки");
}
function lineSheet(i){
  var l=S.draft.lines[i];if(!l)return;
  var it=l.code?find(l.code):(l.replCode?find(l.replCode):null);
  var h='<b>'+esc(lineTxt(l))+'</b>';
  if(l.replCode){
    var bs=l.base||0,br=l.baseRepl||0;
    h+='<div class="mut" style="margin:6px 0">Замена. '+(l.base!==undefined?'Укажите итоговые значения (было '+fmt(l.base)+' / '+fmt(l.baseRepl)+').':'Можно изменить количество нового и заменяемого.')+'</div>'+
    '<label>Новое, '+esc(l.unit)+'</label><div class="row"><button class="btn sec" data-st2="lQty:-1">−</button><input id="lQty" inputmode="decimal" value="'+(bs+l.qty)+'"><button class="btn sec" data-st2="lQty:1">+</button></div>'+
    '<label>Заменяется (макс. '+(it?fmt(br+avail(it)+l.replQty):"—")+')</label><div class="row"><button class="btn sec" data-st2="lRep:-1">−</button><input id="lRep" inputmode="decimal" value="'+(br+l.replQty)+'"><button class="btn sec" data-st2="lRep:1">+</button></div>';
  }else{
    h+='<div class="mut" style="margin:6px 0">'+(l.base!==undefined?'было '+fmt(l.base)+' · ':'')+(it?'можно до '+fmt((l.base||0)+avail(it)+l.qty)+' '+esc(l.unit):'вне проекта')+'</div>'+
    '<label>'+(l.base!==undefined?'Итого должно быть, ':'Количество, ')+esc(l.unit)+'</label><div class="row"><button class="btn sec" data-st2="lQty:-1">−</button><input id="lQty" inputmode="decimal" value="'+((l.base||0)+l.qty)+'"><button class="btn sec" data-st2="lQty:1">+</button></div>';
  }
  h+='<label>Плановая дата получения</label><input id="lDue" type="date" value="'+esc(l.due||S.draft.due||addDays(S.set.days))+'">';
  h+='<button class="btn big" id="lSave" data-i="'+i+'" style="margin-top:12px">Сохранить</button><button class="btn sec big" id="sClose" style="margin-top:8px">Закрыть</button>';
  openSheet(h);
}
function saveLine(i){
  var l=S.draft.lines[i];if(!l)return;
  var bs=l.base||0,br=l.baseRepl||0,isC=l.base!==undefined;
  var q=parseFloat(String($("lQty").value).replace(",","."))||0;
  var it=l.code?find(l.code):(l.replCode?find(l.replCode):null);
  if(isC?q<0:q<=0){toast(isC?"Количество не может быть отрицательным":"Количество должно быть больше нуля");return}
  if(l.replCode){
    var rq=parseFloat(String($("lRep").value).replace(",","."))||0;
    if(isC?rq<0:rq<=0){toast("Проверьте, сколько заменяется");return}
    if(it&&rq>br+avail(it)+l.replQty+1e-9){toast("Заменяется больше, чем осталось по проекту ("+fmt(br+avail(it)+l.replQty)+")");return}
    l.note=String(l.note||"").replace(/вместо [\d.,]+ /,"вместо "+fmt(rq)+" ");
    l.replQty=Math.round((rq-br)*1000)/1000;
  }else if(it&&q>bs+avail(it)+l.qty+1e-9){toast("Больше, чем осталось по проекту ("+fmt(bs+avail(it)+l.qty)+")");return}
  if($("lDue").value)l.due=$("lDue").value;
  l.qty=Math.round((q-bs)*1000)/1000;save();closeSheet();render();toast("Количество изменено");
}
function addOut(){
  var nm=$("oName").value.trim(),un=$("oUnit").value.trim(),q=parseFloat(String($("oQty").value).replace(",","."))||0;
  if(!nm||!un||q<=0){toast("Заполните название, единицу и количество");return}
  var T=targetLines();T.lines.push({sect:$("oSect").value,code:"",name:"",newName:nm,unit:un,qty:q,analog:false,note:$("oNote").value.trim(),replCode:"",replName:"",replQty:0,due:$("oDue").value||S.draft.due||addDays(S.set.days)});
  afterAdd(T);
}
$("fSnap").addEventListener("change",function(){
  var f=this.files[0];if(!f)return;
  var rd=new FileReader();rd.onload=function(){
    try{var t=String(rd.result).replace(/^﻿/,""),o=JSON.parse(t);if(!o.items||!o.v)throw 0;
      if(S.draft.lines.length&&!confirm("В черновике есть позиции. После загрузки реестра остатки пересчитаются. Продолжить?"))return;
      o.ts=o.date;S.snap=o;save();S.view="cat";S.sect=null;render();toast("Реестр загружен: "+o.items.length+" позиций");
    }catch(e){toast("Это не файл реестра объекта")}
  };rd.readAsText(f,"utf-8");this.value="";
});
window.addEventListener("online",hdr);window.addEventListener("offline",hdr);
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register("sw.js").catch(function(){})}
function hsh(t){var h=0,i;for(i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return t.length+":"+h}
function autoSync(){
  if(!/^https?:/.test(location.protocol)||!navigator.onLine||!window.fetch)return;
  fetch("snapshot.json?t="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
    t=t.replace(/^\ufeff/,"");var o=JSON.parse(t);if(!o.items||!o.v)throw 0;
    var sig=hsh(t);
    if(S.snap&&S.snap.sig===sig)return;
    if(S.snap&&S.snap.date&&o.date&&o.date<S.snap.date)return;
    o.ts=o.date;o.sig=sig;S.snap=o;save();render();toast("Реестр обновлён от "+ru(o.date));
  }).catch(function(){});
}
/* ---------- сервер ---------- */
function uid(){return window.crypto&&crypto.randomUUID?crypto.randomUUID():"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
function api(body){return fetch(CFG.api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).then(function(r){return r.json()})}
function saveAuth(){try{localStorage.setItem("bitreq-auth",JSON.stringify(AUTH))}catch(e){}}
function renderLogin(a,f){
  a.innerHTML='<div class="card"><h2>Вход</h2><p class="mut">Рабочая почта и пароль, который пришёл вам на почту.</p><label>Почта</label><input id="lEmail" type="email" autocomplete="username" inputmode="email" placeholder="name@upiterstroy.ru" value="'+esc((AUTH&&AUTH.email)||"")+'"><label>Пароль</label><input id="lPass" type="password" autocomplete="current-password"><div id="lErr" class="mut" style="color:#b3261e;margin-top:8px"></div><button class="btn big" id="bLogin" style="margin-top:12px">Войти</button></div>';
  f.innerHTML="";
}
function doLogin(){
  var em=$("lEmail").value.trim().toLowerCase(),pw=$("lPass").value;
  if(!em||!pw){$("lErr").textContent="Введите почту и пароль";return}
  $("lErr").textContent="Проверяю…";
  api({a:"login",email:em,password:pw}).then(function(d){
    if(!d.ok){$("lErr").textContent=d.error||"Не удалось войти";return}
    var prev=AUTH&&AUTH.obj;
    AUTH={token:d.token,email:d.email,name:d.name,role:d.role,objects:d.objects,obj:(d.objects.filter(function(o){return o.code===prev})[0]||d.objects[0]||{}).code||""};
    saveAuth();resetS();load();S.view="cat";render();sync(true);
  }).catch(function(){$("lErr").textContent="Нет связи с сервером. Проверьте интернет."});
}
function resetS(){S.snap=null;S.draft={no:null,lines:[],due:"",author:""};S.reqs=[];S.plan={};S.srv={pend:{},max:0,all:[],last:""};S.sect=null;S.q="";S.view="cat"}
function logout(){if(AUTH){AUTH.token="";saveAuth()}resetS();render()}
function switchObj(code){save();AUTH.obj=code;saveAuth();resetS();load();closeSheet();render();sync(true)}
function objSheet(){openSheet('<b>Объект</b>'+AUTH.objects.map(function(o){return '<button class="btn'+(o.code===AUTH.obj?'':' sec')+' big" data-obj="'+esc(o.code)+'" style="margin-top:8px">'+esc(o.label)+'</button>'}).join("")+'<button class="btn sec big" id="sClose" style="margin-top:8px">Закрыть</button>')}
function passSheet(){openSheet('<b>Смена пароля</b><label>Старый пароль</label><input id="pOld" type="password"><label>Новый пароль (не короче 8 символов)</label><input id="pNew" type="password"><div id="pErr" class="mut" style="color:#b3261e;margin-top:6px"></div><button class="btn big" id="pSave" style="margin-top:10px">Сохранить</button><button class="btn sec big" id="sClose" style="margin-top:8px">Закрыть</button>')}
function savePass(){
  api({a:"passwd",token:AUTH.token,old:$("pOld").value,neu:$("pNew").value}).then(function(d){
    if(d.ok){closeSheet();toast("Пароль изменён")}else if(d.auth)logout();else $("pErr").textContent=d.error||"Не удалось"
  }).catch(function(){$("pErr").textContent="Нет связи с сервером"});
}
var syncing=false;
function packReq(r){return {cid:r.cid,no:r.no,date:r.date,due:r.due,ver:r.ver,corr:r.corr||"",rev:r.rev||0,sent:!!r.sent,lines:r.lines}}
function sync(manual){
  if(!CFG.api||!AUTH||!AUTH.token||!AUTH.obj)return;
  if(!navigator.onLine){if(manual)toast("Нет интернета — данные обновятся позже");return}
  if(syncing)return;
  S.reqs.forEach(function(r){if(!r.cid)r.cid=uid()});
  var out=S.reqs.filter(function(r){return !r.synced}).map(packReq);
  syncing=true;
  api({a:"sync",token:AUTH.token,obj:AUTH.obj,snapVer:S.snap?S.snap.date:"",outbox:out}).then(function(d){
    syncing=false;
    if(!d.ok){if(d.auth){logout();toast("Войдите заново")}else if(manual)toast(d.error||"Ошибка");return}
    applySync(d);if(manual)toast("Данные обновлены");
  }).catch(function(){syncing=false;if(manual)toast("Нет связи с сервером")});
}
function applySync(d){
  var msgs=[],by={};S.reqs.forEach(function(r){by[r.cid]=r});
  if(d.user){AUTH.name=d.user.name;AUTH.role=d.user.role}
  if(d.objects){AUTH.objects=d.objects}saveAuth();
  var srvBy={};(d.reqs||[]).forEach(function(x){srvBy[x.cid]=x});
  (d.results||[]).forEach(function(x){
    var r=by[x.cid];if(!r)return;
    if(x.rejected){r.synced=true;msgs.push("№"+r.no+": "+x.rejected);var sr=srvBy[x.cid];
      if(sr){r.lines=sr.lines;r.no=sr.no;r.sent=sr.sent;r.reg=sr.reg;r.due=sr.due}r.err="";return}
    if(x.error){r.synced=true;r.err=x.error;msgs.push("№"+r.no+": "+x.error);return}
    if(x.no&&x.no!==r.no){msgs.push("Номер заявки изменён на №"+x.no+" (прежний занят)");r.no=x.no}
    r.synced=true;r.err="";r.warn=x.warn||"";
  });
  if(d.snap){S.snap=d.snap;S.snap.ts=d.snap.date}
  S.srv={pend:d.pend||{},max:d.maxNo||0,all:d.reqs||[],last:d.now||""};
  (d.reqs||[]).forEach(function(sr){
    if(!sr.mine)return;var l=by[sr.cid];
    if(!l){S.reqs.push({cid:sr.cid,no:sr.no,date:sr.date,ts:sr.date+" 00:00",due:sr.due,author:sr.author,ver:sr.ver,corr:sr.corr||undefined,rev:sr.rev||undefined,lines:sr.lines,sent:sr.sent,reg:sr.reg,synced:true,warn:sr.warn});by[sr.cid]=S.reqs[S.reqs.length-1];return}
    l.reg=sr.reg;l.canceled=sr.canceled;if(l.synced){l.no=sr.no;if(sr.sent)l.sent=true;l.warn=sr.warn}
  });
  S.reqs.sort(function(a,b){return (a.date+a.no)<(b.date+b.no)?-1:1});
  save();render();
  if(msgs.length)toast(msgs.join(" · "));
}
function boot(cfg){
  CFG.api=(cfg&&cfg.api)||(AUTH&&AUTH.api)||"";
  if(CFG.api&&AUTH)AUTH.api=CFG.api;
  load();S.reqs.forEach(function(r){if(!r.cid)r.cid=uid()});
  render();
  if(CFG.api){if(AUTH&&AUTH.token)sync();}else autoSync();
}
try{AUTH=JSON.parse(localStorage.getItem("bitreq-auth")||"null")}catch(e){AUTH=null}
if(AUTH&&AUTH.api&&!navigator.onLine){boot({api:AUTH.api})}
else if(window.fetch&&/^https?:/.test(location.protocol)){fetch("config.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():{}}).catch(function(){return {}}).then(boot)}
else boot({});
window.addEventListener("online",function(){sync()});
document.addEventListener("visibilitychange",function(){if(!document.hidden){if(CFG.api)sync();else autoSync()}});
setInterval(function(){if(!document.hidden&&CFG.api)sync()},90000);
</script>
